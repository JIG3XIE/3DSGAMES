<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>3DS Games</title>

  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <header>
    <h1>3DS Games</h1>
    <p>Unlock QR downloads for 3DS games.</p>
  </header>

  <main class="game-grid">

    <div class="game-card">
      <img src="images/supermario3dland.jpg" alt="SUPER MARIO 3D LAND">
      <h2>SUPER MARIO 3D LAND</h2>
      <p>November 3, 2011.</p>
      <button onclick="openUnlock('SUPER MARIO 3D LAND', 'SUPER MARIO 3D LAND')">
        Unlock with Code
      </button>
    </div>

    <div class="game-card">
      <img src="images/zombie-hallway-cover.png" alt="Zombie Hallway Cover">
      <h2>Zombie Hallway</h2>
      <p>A small survival game made for 3DS.</p>
      <button onclick="openUnlock('zombie-hallway', 'Zombie Hallway')">
        Unlock with Code
      </button>
    </div>

  </main>

  <div id="popup" class="popup hidden">
    <div class="popup-box">
      <button class="close-btn" onclick="closePopup()">×</button>

      <h2 id="popup-title">Unlock Game</h2>
      <p>Enter your code below.</p>

      <input id="code-input" type="text" placeholder="Example: CHRIS-A7K9P2" />

      <button id="submit-btn" onclick="redeemCode()">Submit Code</button>

      <p id="message"></p>

      <div id="qr-section" class="hidden">
        <h3 id="qr-title">QR Code</h3>
        <p>Scan this QR code with your 3DS.</p>
        <img id="qr-image" src="" alt="Game QR Code">
        <p id="uses-left"></p>
      </div>
    </div>
  </div>

  <footer>
    <p>© 2026 Chris 3DS Games. Original homebrew games only.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
